services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=sentinel-dev-secret-change-in-production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY=http://api:8000
    depends_on:
      api:
        condition: service_healthy
